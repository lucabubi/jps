networks:
  default:
    external: true
    name: jps-net

services:
  analytics_crm:
    image: g19/analytics_crm
    ports:
      - "8084:8084"
    env_file:
      - ../.env
    depends_on:
      - mongo
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: analytics



volumes:
  mongo_data:
