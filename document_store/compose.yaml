networks:
  default:
    external: true
    name: jps-net

services:
  document_store:
    image: g19/document_store
    ports:
      - "8082:8080"
    env_file:
      - ../.env
    depends_on:
      - postgres
  postgres:
    image: postgres:latest
    ports:
      - "5557:5432"
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data: