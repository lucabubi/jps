spring.application.name=gatewayAPI
server.port=8083

# OAuth2 Keycloak
spring.security.oauth2.client.provider.keycloak.issuer-uri=${ISSUER_URI}
spring.security.oauth2.client.registration.oidc-app-client.provider=keycloak
spring.security.oauth2.client.registration.oidc-app-client.client-id=kc1client
spring.security.oauth2.client.registration.oidc-app-client.client-secret=K5N59toSW1sKyJLgVVoWmqMbhhOpeIpx
spring.security.oauth2.client.registration.oidc-app-client.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.oidc-app-client.redirect-uri=http://localhost:8083/login/oauth2/code/kc1client
spring.security.oauth2.client.registration.oidc-app-client.scope[0]=openid

# Gateway
spring.cloud.gateway.mvc.http-client.type=autodetect

# Route CRM
spring.cloud.gateway.mvc.routes[0].id=CRM
spring.cloud.gateway.mvc.routes[0].uri=http://host.docker.internal:8080
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/API/professionals/**, /API/customers/**, /API/joboffers/**, /API/contacts/**, /API/messages/**
spring.cloud.gateway.mvc.routes[0].filters[0]=TokenRelay

# Route Communication Manager
spring.cloud.gateway.mvc.routes[1].id=communication_manager
spring.cloud.gateway.mvc.routes[1].uri=http://host.docker.internal:8081
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/API/emails/**
spring.cloud.gateway.mvc.routes[1].filters[0]=TokenRelay

